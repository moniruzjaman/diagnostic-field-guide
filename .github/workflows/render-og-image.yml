name: Render social preview image

on:
  push:
    branches: [main]
    paths:
      - "og-image.py"
      - "og-image.html"
      - "index.html"
      - "fonts/**"
      - ".github/workflows/render-og-image.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-og-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Bengali font and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Render 1200x630 JPEG
        run: |
          python og-image.py
          python og-image.py --check

      - name: Commit generated preview when changed
        run: |
          if git diff --quiet -- og-image.jpg; then
            echo "Preview image is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-image.jpg
          git commit -m "chore: regenerate v2 social preview image"
          git push
