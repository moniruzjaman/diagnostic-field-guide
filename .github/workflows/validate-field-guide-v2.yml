name: Validate Field Guide v2
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check js/field-diagnosis.js
      - run: node --check js/symptom-matcher.js
      - run: node --check js/diagnosis-wizard.js
      - run: node --check js/image-picker.js
      - run: node --test tests/*.cjs
      - name: Verify offline assets are registered
        run: |
          test -f field-diagnosis.html
          test -f css/field-diagnosis.css
          grep -q "field-diagnosis.html" sw.js
          grep -q "field-diagnosis.js" sw.js
          grep -q "image-picker.js" sw.js
      - name: Validate social preview generator
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          python -m pip install Pillow
          python -m py_compile og-image.py
          python og-image.py --output /tmp/og-image.jpg
          python og-image.py --output /tmp/og-image.jpg --check
