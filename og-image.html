<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<style>
@font-face {
  font-family: 'NSB';
  src: url('fonts/NotoSansBengali-700-bengali.woff2') format('woff2');
  font-weight: 700;
}
@font-face {
  font-family: 'NSB';
  src: url('fonts/NotoSansBengali-400-bengali.woff2') format('woff2');
  font-weight: 400;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 630px; overflow: hidden; }
.hero {
  width: 1200px; height: 630px;
  background: linear-gradient(150deg, #0E3D22 0%, #145A32 55%, #1E8449 100%);
  color: #fff; position: relative;
  display: flex; flex-direction: column; justify-content: center; padding: 0 90px;
  font-family: 'NSB', sans-serif;
}
.hero::before {
  content: ""; position: absolute; top: -160px; right: -160px;
  width: 480px; height: 480px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(82,190,128,.3), transparent 65%);
}
.hero::after {
  content: ""; position: absolute; bottom: -200px; left: -140px;
  width: 520px; height: 520px; border-radius: 50%;
  background: radial-gradient(circle at 70% 70%, rgba(174,214,142,.18), transparent 65%);
}
.leaf { position: absolute; font-size: 150px; opacity: .16; right: 90px; bottom: 60px; }
.tag {
  display: inline-block; width: fit-content;
  font-size: 22px; letter-spacing: 2px; color: #A9DFBF;
  border: 1.5px solid rgba(169,223,191,.55);
  padding: 8px 24px; border-radius: 999px; margin-bottom: 30px;
}
h1 { font-size: 72px; font-weight: 700; line-height: 1.16; margin-bottom: 18px; }
.sub { font-size: 30px; color: #D5F5E3; margin-bottom: 34px; font-weight: 400; }
.meta {
  display: flex; gap: 34px; font-size: 21px; color: #A9DFBF;
  border-top: 1px solid rgba(169,223,191,.35); padding-top: 26px; width: fit-content;
}
.meta b { color: #fff; }
.badge2 {
  position: absolute; top: 48px; right: 90px;
  font-size: 20px; color: #0E3D22; background: #A9DFBF;
  padding: 10px 22px; border-radius: 10px; font-weight: 700;
}
</style>
</head>
<body>
<div class="hero">
  <div class="tag">ই-বুক · বাংলা · অফলাইন PWA</div>
  <h1>উদ্ভিদ রোগনির্ণয়<br>ফিল্ড গাইড</h1>
  <div class="sub">ফসলের সমস্যা নির্ণয় ও ব্যবস্থাপনার সুপারিশের হাতে-কলমে নির্দেশিকা</div>
  <div class="meta">
    <span>১০০+ <b>পৃষ্ঠা</b></span>
    <span>২৬৫ <b>রোগনির্ণয়ের ছবি</b></span>
    <span>১১ <b>তথ্য-সারণি</b></span>
    <span>CABI <b>Plantwise</b></span>
  </div>
  <div class="leaf">🌿</div>
  <div class="badge2">বিনামূল্যে · CC BY-NC</div>
</div>
</body>
</html>
